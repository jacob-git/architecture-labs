[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "architecture-labs"
version = "0.1.0"
description = "Public, reproducible experiments for testing architecture claims."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jacob George" }]

[project.scripts]
aeg-lab-001-phase-a = "labs.aeg_001.phase_a:main"
aeg-lab-001-phase-b = "labs.aeg_001.phase_b:main"

[tool.setuptools.packages.find]
include = ["labs*"]
