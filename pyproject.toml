[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "architecture-labs"
version = "0.8.0"
description = "Public, reproducible experiments for testing architecture claims."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jacob George" }]

[project.scripts]
aeg-lab-001-phase-a = "labs.aeg_001.phase_a:main"
aeg-lab-001-phase-b = "labs.aeg_001.phase_b:main"
shield-lab-001-phase-a = "labs.shield_001.phase_a:main"
shield-lab-001-phase-b = "labs.shield_001.phase_b:main"
shield-lab-001-v2-validation = "labs.shield_001.v2_validation:main"
shield-lab-001-phase-c = "labs.shield_001.phase_c:main"
shield-lab-001-phase-c2 = "labs.shield_001.phase_c2:main"
shield-lab-001-temporal-v2-validation = "labs.shield_001.temporal_v2_validation:main"

[tool.setuptools.packages.find]
include = ["labs*"]
