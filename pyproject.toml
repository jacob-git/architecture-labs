[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "architecture-labs"
version = "0.27.0"
description = "Public, reproducible experiments for testing architecture claims."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jacob George" }]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aeg-lab-001-phase-a = "labs.aeg_001.phase_a:main"
aeg-lab-001-phase-b = "labs.aeg_001.phase_b:main"
shield-lab-001-phase-a = "labs.shield_001.phase_a:main"
shield-lab-001-phase-b = "labs.shield_001.phase_b:main"
shield-lab-001-v2-validation = "labs.shield_001.v2_validation:main"
shield-lab-001-phase-c = "labs.shield_001.phase_c:main"
shield-lab-001-phase-c2 = "labs.shield_001.phase_c2:main"
shield-lab-001-temporal-v2-validation = "labs.shield_001.temporal_v2_validation:main"
shield-lab-001-phase-d = "labs.shield_001.phase_d:main"
shield-lab-001-temporal-v3-validation = "labs.shield_001.temporal_v3_validation:main"
shield-lab-001-phase-e = "labs.shield_001.phase_e:main"
shield-lab-001-phase-f = "labs.shield_001.phase_f:main"
shield-lab-001-phase-f2 = "labs.shield_001.phase_f2:main"
shield-lab-001-authority-v2-validation = "labs.shield_001.authority_v2_validation:main"
aeg-shield-lab-001 = "labs.aeg_shield_001.runner:main"
aeg-shield-lab-001-phase-b = "labs.aeg_shield_001.phase_b:main"
aeg-shield-lab-001-phase-c = "labs.aeg_shield_001.phase_c:main"
aeg-shield-lab-001-phase-d = "labs.aeg_shield_001.phase_d:main"
aeg-shield-lab-001-phase-e = "labs.aeg_shield_001.phase_e:main"
aeg-shield-lab-001-phase-f = "labs.aeg_shield_001.phase_f:main"
adp-lab-001-phase-a = "labs.adp_001.phase_a:main"
adp-lab-001-phase-b = "labs.adp_001.phase_b:main"
adp-lab-001-phase-b2 = "labs.adp_001.phase_b2:main"
adp-lab-001-phase-b2-validation = "labs.adp_001.phase_b2_validation:main"
adp-lab-001-analyze-b2 = "labs.adp_001.analyze_b2:main"
adp-lab-001-phase-b3 = "labs.adp_001.phase_b3:main"
adp-lab-001-phase-b4 = "labs.adp_001.phase_b4:main"
adp-lab-001-phase-b4-validation = "labs.adp_001.phase_b4_validation:main"
adp-lab-001-analyze-b4 = "labs.adp_001.analyze_b4:main"
adp-lab-001-phase-b5 = "labs.adp_001.phase_b5:main"
adp-lab-001-evaluate = "labs.adp_001.evaluator:main"
adp-lab-001-b2-evaluate = "labs.adp_001.b2_evaluator:main"
adp-lab-001-b4-evaluate = "labs.adp_001.b4_evaluator:main"

[tool.setuptools.packages.find]
include = ["labs*"]
